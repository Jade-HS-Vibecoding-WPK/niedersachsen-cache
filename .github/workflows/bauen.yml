# Baut den Niedersachsen-Cache aus dem Geofabrik-Auszug und veröffentlicht ihn auf GitHub Pages.
#
# Ablauf: Auszug laden -> bauen -> Größe prüfen (Abbruch über 900 MB) -> Selbsttest -> Pages-Artefakt -> veröffentlichen
#         -> STAND.md schreiben und committen (hält den Zeitplan am Leben: GitHub schaltet geplante Läufe
#            in öffentlichen Repos nach 60 Tagen ohne Aktivität ab).
# Die Daten selbst werden NICHT ins Git eingecheckt, sie liegen nur auf der Pages-Seite.
# Voraussetzung: Settings -> Pages -> Source: "GitHub Actions".

name: Cache bauen

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"   # jeden Montag 02:17 UTC (nachts)

permissions:
  contents: read

concurrency:
  group: cache-bauen
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # STAND.md committen
      pages: write      # auf GitHub Pages veröffentlichen
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bauen/requirements.txt

      - name: Python-Pakete installieren
        run: pip install -r bauen/requirements.txt

      - name: Geofabrik-Auszug laden (ca. 500 MB)
        run: |
          mkdir -p roh
          G=https://download.geofabrik.de/europe/germany
          curl -fsSL --retry 5 --retry-delay 30 -o roh/niedersachsen-latest.osm.pbf     $G/niedersachsen-latest.osm.pbf
          curl -fsSL --retry 5 --retry-delay 30 -o roh/niedersachsen-latest.osm.pbf.md5 $G/niedersachsen-latest.osm.pbf.md5
          cd roh && md5sum -c niedersachsen-latest.osm.pbf.md5 && ls -l

      - name: Kacheln bauen
        run: python bauen/bauen.py --pbf roh/niedersachsen-latest.osm.pbf --ausgabe site

      - name: Seite zusammenstellen
        run: cp web/index.html web/nds-cache.js site/

      - name: Größe prüfen
        run: |
          GROESSE=$(du -sb site | cut -f1)
          DATEIEN=$(find site -type f | wc -l)
          echo "Seitengröße: $((GROESSE / 1000000)) MB in $DATEIEN Dateien"
          du -sh site/daten/*
          echo "### Niedersachsen-Cache: $((GROESSE / 1000000)) MB, $DATEIEN Dateien" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GROESSE" -gt 900000000 ]; then
            echo "::error::Seite ist größer als 900 MB. Zuerst puffer_m in bauen/staedte.json verkleinern."
            exit 1
          fi

      - name: Selbsttest
        run: node pruefen/selbsttest.js site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: STAND.md schreiben und committen
        env:
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python bauen/stand.py site > STAND.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STAND.md
          if git diff --cached --quiet; then echo "STAND.md unverändert"; exit 0; fi
          DATENSTAND=$(python -c "import json;print(json.load(open('site/daten/manifest.json'))['datenstand'])")
          git commit -m "Datenstand $DATENSTAND (automatisch)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 10; done
          echo "::warning::STAND.md konnte nicht gepusht werden"
